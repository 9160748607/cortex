# ---------------------------------------------------------------------------
# schemachange config - PROD context
#
# Promoted from QA via GitHub PR only, after business validation.
#
# Deploy:
#   schemachange deploy --config-folder schemachange/config \
#     --config-file-name schemachange-config-prod.yml --create-change-history-table
# ---------------------------------------------------------------------------
config-version: 1

root-folder: 'schemachange/scripts'

change-history-table: 'GOVERNANCE.SCHEMACHANGE.CHANGE_HISTORY_PROD'
create-change-history-table: true

connection-name: 'ysirciu-vg28332'

vars:
  env: 'PROD'
  database: 'SALES_PROD'
  governance_database: 'GOVERNANCE'
  warehouse: 'COMPUTE_WH'

  # Intentionally EMPTY: prod hosts live data and must be permanent, so
  # fail-safe applies. Architectural note 1 scopes TRANSIENT to dev/qa only.
  object_type: ''
  retention_days: 7

  cost_center: 'CC-SALES-ANALYTICS'
  chargeback_owner: 'sales-data-engineering'

  # Recipient for silver data-quality failure alerts (08_data_quality/V8.1.5).
  # Per-environment on purpose. Must be a VERIFIED email on a user in this
  # account or SYSTEM$SEND_EMAIL fails.
  # TODO before prod deploy: replace with the production on-call distribution
  # list. Leaving an individual's personal address here would make prod DQ
  # alerting depend on one person's mailbox.
  dq_notification_email: 'nagur7749@gmail.com'
